name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      # pyproject.toml's own addopts already excludes tests marked "model"
      # (loads a real embedding model, slow and unnecessary to prove the
      # logic is correct), so this runs the same fast suite locally
      # development already runs, no index or network required.
      - name: Run tests
        run: uv run python -m pytest tests/

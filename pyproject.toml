[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "Retrieval-augmented generation over Indian court judgments, built without a framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "sentence-transformers>=5.6.1",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
markers = [
    "model: loads the embedding model, slow. Run with -m model",
]
addopts = "-m 'not model'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
